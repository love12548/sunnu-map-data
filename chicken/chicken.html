<meta charset="utf-8"><script>/* 紀錄合併（iframe 遊戲與主頁共用）：數字取大、布林取 true、陣列聯集、物件逐鍵；賽車紀錄的時間 t／名次 rk 取小，分段 sp 跟著較快的那筆 */
function recMerge(a, b, p) {
  if (a === undefined || a === null) return b; if (b === undefined || b === null) return a;
  if (typeof a === 'number' && typeof b === 'number') return (p === 't' || p === 'rk') ? ((a && b) ? Math.min(a, b) : (a || b)) : Math.max(a, b);
  if (typeof a === 'boolean' && typeof b === 'boolean') return a || b;
  if (Array.isArray(a) && Array.isArray(b)) { var o = a.slice(); b.forEach(function (x) { if (o.indexOf(x) < 0) o.push(x); }); return o; }
  if (typeof a === 'object' && typeof b === 'object' && !Array.isArray(a) && !Array.isArray(b)) {
    var r = {}; Object.keys(b).forEach(function (k) { r[k] = b[k]; }); Object.keys(a).forEach(function (k) { r[k] = recMerge(a[k], b[k], k); });
    if ('sp' in a || 'sp' in b) { var ta = a.t, tb = b.t; r.sp = (ta && (!tb || ta <= tb)) ? (a.sp || b.sp || null) : (b.sp || a.sp || null); }
    return r;
  }
  return a;
}
var REC_KEYS = ['sunnuRaceRec', 'sunnuDinoHI', 'sunnuDinoStats', 'sunnuShooterBest', 'sunnuShooterLevel'];
/* 紀錄橋（iframe 遊戲內）：把最佳成績等紀錄同步給主頁（主頁存在 sunnu.co、跟著會員存檔走），開啟時再收回主頁存的較好紀錄。
   主頁用網址 #rec=… 把紀錄帶進來，要在遊戲讀取紀錄之前就合併好，所以這段放在最前面。 */
(function () {
  if (window.parent === window) return;
  var ls, set = Storage.prototype.setItem, get = Storage.prototype.getItem;
  try { ls = window.localStorage; get.call(ls, 'x'); } catch (e) { return; }
  function rd(k) { try { var v = get.call(ls, k); return v === null ? undefined : JSON.parse(v); } catch (e) { return undefined; } }
  function send(keys) { var kv = {}; (keys || REC_KEYS).forEach(function (k) { var v = get.call(ls, k); if (v !== null) kv[k] = v; }); if (Object.keys(kv).length) { try { parent.postMessage({ sunnuRec: 1, kv: kv }, '*'); } catch (e) { } } }
  try {
    var m = /[#&]rec=([^&]+)/.exec(location.hash);
    if (m) { var inc = JSON.parse(decodeURIComponent(escape(atob(m[1])))); Object.keys(inc).forEach(function (k) { if (REC_KEYS.indexOf(k) < 0) return; var cur = rd(k), mg = recMerge(cur, inc[k], k); if (JSON.stringify(mg) !== JSON.stringify(cur)) set.call(ls, k, JSON.stringify(mg)); }); }
  } catch (e) { }
  Storage.prototype.setItem = function (k, v) { set.call(this, k, v); if (this === ls && REC_KEYS.indexOf(k) >= 0) send([k]); };
  addEventListener('load', function () { send(); });
})();
</script>

<script>/* 鹹水雞小貨車的廣播聲（原創合成，不使用任何現成錄音或旋律）
   特徵參考使用者提供的錄音「感覺」：節奏很快的短樂句反覆播放、中高頻為主的小喇叭擴音器音色、聲音有點破。旋律是我另外寫的。
   用法：var s = TruckSound.create(audioCtx); s.start(); s.setDistance(0..1)（0＝貼臉，1＝很遠）; s.setSpeed(0..1); s.stop(); */
(function (root) {
  var NOTE = function (m) { return 440 * Math.pow(2, (m - 69) / 12); };
  /* 原創樂句（半音編號；0＝休止）：五聲音階、八分音符為一格，四小節反覆，結尾故意上揚勾人 */
  var PHRASE = [76, 79, 81, 79, 76, 0, 74, 76, 79, 76, 74, 72, 74, 0, 0, 0, 81, 84, 81, 79, 76, 79, 81, 0, 79, 76, 74, 76, 72, 74, 76, 0];
  /* 「說話感」：共振峰人聲合成。字詞是商品名「鹹水雞、鹹水鴨」，音高與節奏是原創的吟唱，不是任何錄音。
     每個音節 [母音共振峰序列, 聲母（'sh'/'x'/'j'/null）, 長度（拍）, 音高（半音編號）, 尾音是否鼻音] */
  var FM = { a: [820, 1250, 2700], i: [300, 2350, 3050], u: [330, 850, 2450], e: [520, 1850, 2550], o: [520, 920, 2500], n: [260, 1500, 2500] };
  var SCRIPT = [
    [['i', 'e', 'n'], 'x', 1.0, 64, 1], [['u', 'e', 'i'], 'sh', 1.0, 62, 0], [['i'], 'j', 1.6, 67, 0],
    [['i', 'e', 'n'], 'x', 1.0, 64, 1], [['u', 'e', 'i'], 'sh', 1.0, 62, 0], [['i', 'a'], null, 1.8, 60, 0],
    [['a', 'o'], null, 0.6, 64, 0], [['a', 'o'], null, 0.6, 67, 0], [['i', 'e'], null, 1.4, 69, 0]
  ];
  function create(ctx, opt) {
    opt = opt || {};
    var BPM = opt.bpm || 178, step = 60 / BPM / 2;                 /* 八分音符 ≈ 0.17 秒，四分音符 ≈ 0.34 秒（與參考錄音的節奏速度同級） */
    var out = ctx.createGain(); out.gain.value = 0;
    var pan = ctx.createStereoPanner ? ctx.createStereoPanner() : null;
    var far = ctx.createBiquadFilter(); far.type = 'lowpass'; far.frequency.value = 6000; far.Q.value = 0.7;     /* 越遠越悶 */
    var spk = ctx.createBiquadFilter(); spk.type = 'bandpass'; spk.frequency.value = 1400; spk.Q.value = 0.55;   /* 小喇叭：中高頻 */
    var drive = ctx.createWaveShaper(); var cv = new Float32Array(512); for (var i = 0; i < 512; i++) { var x = i / 256 - 1; cv[i] = Math.tanh(x * 3.2); } drive.curve = cv; drive.oversample = '2x';

/* 獎牌：搶到鹹水雞＝銅；金、銀是時間門檻（秒，2026-10-26 機器人每個彎都漂移、普通難度的完賽時間 ×1.05／×1.15） */
var MEDAL = { '新竹縣山路': [90, 98], '北海岸公路': [106, 116], '雪山盤山路': [108, 119], '冷門車站': [104, 114], '秋名山・下坡': [80, 87], '秋名山・上坡': [81, 89] };
var MDN = ['', '銅', '銀', '金'];
function mdTag(m) { return m ? '<i class="md m' + m + '">' + MDN[m] + '</i>' : ''; }
function recKey(i) { return TRACKS[i].name + '|' + EDIFF; }
function recAll() { try { return JSON.parse(localStorage.getItem('sunnuRaceRec') || '{}') || {}; } catch (e) { return {}; } }
function recOf(i) { return recAll()[recKey(i)] || null; }
function recSave(i, v) { var a = recAll(); a[recKey(i)] = v; try { localStorage.setItem('sunnuRaceRec', JSON.stringify(a)); } catch (e) { } }
function medalOf(i, t) { var m = MEDAL[TRACKS[i].name]; if (t == null) return 0; if (!m) return 1; return t <= m[0] ? 3 : t <= m[1] ? 2 : 1; }
var FTR = TRACKS.map(function (t, i) { return i; }).filter(function (i) { return !TRACKS[i].relay; });
var fSel = (function () { var i = TKI; if (FTR.indexOf(i) < 0) { try { i = +localStorage.getItem('sunnuRaceTrack'); } catch (e) { } } return Math.max(0, FTR.indexOf(i)); })();

/* 賽道小地圖：用轉角清單積分出前 3600 公尺 */
function trackPoly(i) { var T = TRACKS[i].turns, x = 0, z = 0, th = 0, pts = [[0, 0]], tot = 0; for (var k = 0; k < T.length && tot < 3600; k++) { var n = Math.max(1, Math.round(T[k][0] / 6)), dl = T[k][0] / n, da = T[k][1] * Math.PI / 180 / n; for (var j = 0; j < n && tot < 3600; j++) { th += da; x += Math.sin(th) * dl; z -= Math.cos(th) * dl; tot += dl; pts.push([x, z]); } } return pts; }
function drawMini(cv, i) {
  var w = cv.width = cv.clientWidth * 2 || 560, h = cv.height = 240, g = cv.getContext('2d'), P = trackPoly(i), x0 = 1e9, x1 = -1e9, z0 = 1e9, z1 = -1e9;
  P.forEach(function (p) { x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); z0 = Math.min(z0, p[1]); z1 = Math.max(z1, p[1]); });
  var sc = Math.min((w - 40) / (x1 - x0 || 1), (h - 40) / (z1 - z0 || 1)), ox = (w - (x1 - x0) * sc) / 2, oz = (h - (z1 - z0) * sc) / 2, X = function (p) { return ox + (p[0] - x0) * sc; }, Z = function (p) { return oz + (p[1] - z0) * sc; };
  g.clearRect(0, 0, w, h); g.lineJoin = g.lineCap = 'round';
  [[10, '#3b2a1e'], [5, TRACKS[i].akina || TRACKS[i].night ? '#9fb4ff' : '#ffe38a']].forEach(function (st) { g.strokeStyle = st[1]; g.lineWidth = st[0]; g.beginPath(); P.forEach(function (p, k) { k ? g.lineTo(X(p), Z(p)) : g.moveTo(X(p), Z(p)); }); g.stroke(); });
  var a = P[0], b = P[P.length - 1]; g.fillStyle = '#5be37a'; g.fillRect(X(a) - 9, Z(a) - 9, 18, 18); g.fillStyle = '#e8412c'; g.fillRect(X(b) - 9, Z(b) - 9, 18, 18);
}
function fmtD(d) { return (d < 0 ? '−' : '+') + Math.abs(d).toFixed(1) + ' 秒'; }
function renderModes() {
  var m = $('modeSel'); m.innerHTML = ''; [['淘汰賽', false], ['自由賽', true]].forEach(function (q) {
    if (!q[1] && window.__SHORT) return; var b = document.createElement('span'); b.textContent = q[0]; if (q[1] === FREE) b.className = 'on';
    b.onclick = function () { if (q[1] === FREE) return; try { localStorage.setItem(KOKEY, q[1] ? '0' : '2'); } catch (e) { } location.href = navTo(q[1] ? FTR[fSel] : 0); };
    m.appendChild(b);
  });
  $('tkName').textContent = FREE ? '' : '四條賽道一路接著跑・每個檢查點淘汰最後一名';
  $('tkName').style.display = FREE ? 'none' : '';
}
function renderCard() {
  var c = $('freeCard'); if (!FREE) { c.style.display = 'none'; return; }
  var i = FTR[fSel], T = TRACKS[i], rc = recOf(i), md = MEDAL[T.name];
  c.style.display = 'block';
  c.innerHTML = '<div class="hd"><span class="ar" data-d="-1">◀</span><b>' + T.name + '</b><span class="ar" data-d="1">▶</span></div>' +
    '<div class="dots">' + FTR.map(function (q, k) { return k === fSel ? '●' : '○'; }).join('') + '</div><canvas></canvas><div class="ds">' + (TDESC[T.name] || '') + '</div>' +
    '<div class="rc">' + (rc && rc.t != null ? '<span class="k">最佳時間</span> ' + fmt(rc.t) + ' ' + mdTag(rc.m) : rc ? '<span class="k">還沒搶到過</span>' : '<span class="k">還沒跑過</span>') + (rc ? '　<span class="k">最佳名次</span> 第 ' + rc.rk + ' 名' : '') + '</div>' +
    (rc && rc.god ? '<div class="rc" style="color:#ffe38a">稱號：秋名山車神</div>' : rc && rc.gut ? '<div class="rc"><span class="k">水溝過彎最多</span> ' + rc.gut + ' 次</div>' : '') + '<div class="rc"><span class="k">獎牌</span> ' + mdTag(3) + (md ? fmt(md[0]) : '') + ' ' + mdTag(2) + (md ? fmt(md[1]) : '') + ' ' + mdTag(1) + '搶到就有</div>' +
    '<div class="opt"><span data-ko class="' + (koOn() ? 'on' : '') + '">淘汰檢查點：' + (koOn() ? '開' : '關') + '</span>' +
    (EMBED ? '<span style="cursor:default">難度：' + { easy: '簡單', normal: '普通', hard: '困難' }[EDIFF] + '</span>' : ['easy', 'normal', 'hard'].map(function (d) { return '<span data-df="' + d + '" class="' + (d === EDIFF ? 'on' : '') + '">' + { easy: '簡單', normal: '普通', hard: '困難' }[d] + '</span>'; }).join('')) + '</div>';
  drawMini(c.querySelector('canvas'), i);
  $('start').textContent = i === TKI ? '出發！' : '前往 ' + T.name;
}
function fMove(d) { fSel = (fSel + d + FTR.length) % FTR.length; renderCard(); tone(520 + d * 60, .05, 'square', .03, 600); }
(function () {
  renderModes(); renderCard();
  var c = $('freeCard'), dx0 = null;
  c.addEventListener('click', function (e) {
    var t = e.target, d = t.getAttribute && t.getAttribute('data-d'); if (d) { fMove(+d); return; }
    if (t.hasAttribute && t.hasAttribute('data-ko')) { try { localStorage.setItem(KOKEY, koOn() ? '0' : '1'); } catch (x) { } renderCard(); return; }
    var df = t.getAttribute && t.getAttribute('data-df'); if (df && df !== EDIFF) { var q = new URLSearchParams(location.search); q.set('diff', df); q.set('t', FTR[fSel]); q.delete('go'); location.href = location.pathname + '?' + q.toString(); }
  });
  c.addEventListener('pointerdown', function (e) { dx0 = e.clientX; });
  c.addEventListener('pointerup', function (e) { if (dx0 == null) return; var d = e.clientX - dx0; dx0 = null; if (Math.abs(d) > 40) fMove(d < 0 ? 1 : -1); });
  addEventListener('keydown', function (e) { if (!FREE || !$('title').classList.contains('on')) return; if (e.key === 'ArrowLeft') fMove(-1); else if (e.key === 'ArrowRight') fMove(1); else if (e.key === 'Enter') $('start').onclick(); });
  $('start').onclick = function () { var i = FTR[fSel]; if (FREE && i !== TKI) { try { localStorage.setItem('sunnuRaceTrack', i); } catch (e) { } location.href = navTo(i) + '&go=1'; return; } startGame(); };
  if (FREE && /[?&]go=1/.test(location.search)) setTimeout(startGame, 400);
})();

/* 比賽中：右上排名框下面顯示最佳時間；經過分段點顯示比紀錄快或慢 */
var fBest = FREE ? recOf(TKI) : null, fDT = 0;
function freeSplit(k) {
  if (!FREE || S.phase !== 'play') return; S.splits[k - 1] = S.race;
  if (fBest && fBest.sp && fBest.sp[k - 1] != null) { var d = S.race - fBest.sp[k - 1], e = $('rbest'); e.textContent = fmtD(d); e.className = d <= 0 ? 'up' : 'dn'; fDT = 3; }
}
function freeHud(dt) {
  if (!FREE) return; var e = $('rbest');
  if (fDT > 0) { fDT -= dt; return; }
  var t = fBest && fBest.t != null ? '最佳 ' + fmt(fBest.t) : ''; if (e.textContent !== t) { e.textContent = t; e.className = ''; }
}
/* 結算的買周邊橫幅（跟豆花、午仔魚一樣）：隨機開一個鹹水雞周邊（小貨車刺繡老帽、鹹水雞鹹水鴨緹花中筒襪、鹹水雞短袖上衣，使用者提供） */
var SHOP_URLS = ['https://www.sunnu.co/products/%E9%B9%B9%E6%B0%B4%E5%B0%8F%E8%B2%A8%E8%BB%8A%E5%88%BA%E7%B9%A1%E8%80%81%E5%B8%BD-1-1', 'https://www.sunnu.co/products/%E9%B9%B9%E6%B0%B4%E9%9B%9E%EF%BD%9E%E9%B9%B9%E6%B0%B4%E9%B4%A8%EF%BD%9E%E7%B7%B9%E8%8A%B1%E4%B8%AD%E7%AD%92%E8%A5%AA', 'https://www.sunnu.co/products/%E9%B9%B9%E6%B0%B4%E9%9B%9E%E7%9F%AD%E8%A2%96%E4%B8%8A%E8%A1%A3'];
(function () { var b = $('shopband'); b.onclick = function (e) { e.preventDefault(); var u = SHOP_URLS[Math.floor(Math.random() * SHOP_URLS.length)]; try { window.open(u, '_blank', 'noopener'); } catch (x) { } }; })();
function freeResults(rk) {
  document.body.classList.add('ended');
  $('shopband').textContent = rk === 1 && !S.elimP ? '天選鹹水雞鴨人才！來選購周邊吧～' : '好想吃鹹水雞鴨啊！來選購周邊吧～';
  if (FREE) { var rows = $('elist').children; for (var ri = 0; ri < rows.length; ri++) if (ri >= 3 && rows[ri].className !== 'me') rows[ri].style.display = 'none'; }
  var on = FREE; $('again').style.display = on ? 'none' : ''; $('fbtns').style.display = on ? 'flex' : 'none'; $('frec').innerHTML = '';
  if (!on) return;
  var P = R[0], won = S.winner === P && !S.elimP && S.finT > 20, t = won ? S.finT : null, rc = recOf(TKI), best = rc && rc.t != null ? rc.t : null, nb = won && (best == null || t < best), m = medalOf(TKI, t);
  var gN = S.gutN || 0, god = TK.akina && PINS.length && gN >= PINS.length, god0 = rc && rc.god;
  recSave(TKI, { t: nb ? t : best, rk: Math.min(rk, rc && rc.rk || 9), m: Math.max(m, rc && rc.m || 0), sp: nb ? S.splits.slice() : rc && rc.sp || null, n: (rc && rc.n || 0) + 1, gut: Math.max(gN, rc && rc.gut || 0), god: !!(god || god0) });
  if (nb) { ghostSave(); }
  if (won) $('etime').textContent = fmt(t); /* 用時＝超越貨車那一刻，跟完賽時間一致 */
  fBest = recOf(TKI);
  $('frec').innerHTML = won ? (nb ? '<div class="nb">新紀錄！</div>' : '') + '完賽時間 <b>' + fmt(t) + '</b> ' + mdTag(m) + (!nb && best != null ? '<br><small>最佳 ' + fmt(best) + '（' + fmtD(t - best) + '）</small>' : '') + (m < 3 && MEDAL[TK.name] ? '<br><small>' + (m < 2 ? '銀牌 ' + fmt(MEDAL[TK.name][1]) : '金牌 ' + fmt(MEDAL[TK.name][0])) + ' 以內</small>' : '')
    : '沒搶到鹹水雞・第 ' + rk + ' 名' + (best != null ? '<br><small>最佳 ' + fmt(best) + '</small>' : '<br><small>第一個超越貨車才會記錄時間</small>');
  if (TK.akina) $('frec').innerHTML += '<br><small>水溝過彎 ' + gN + '／' + PINS.length + ' 個髮夾彎</small>' + (god ? '<div class="nb">' + (god0 ? '' : '獲得稱號：') + '秋名山車神</div>' : '');
  var b = $('fbtns'); b.innerHTML = '<span data-a>再跑一次</span><span data-c>換賽道</span>' + (EMBED ? '<span data-m>回地圖</span>' : '');
  b.onclick = function (e) {
    var q = e.target; if (q.hasAttribute('data-a')) startGame();
    else if (q.hasAttribute('data-c')) { document.body.classList.remove('ended'); $('end').classList.remove('on'); $('title').classList.add('on'); renderCard(); }
    else if (q.hasAttribute('data-m')) { try { parent.postMessage({ sunnuChicken: 1, free: 1 }, '*'); } catch (x) { } }
  };
}

/* 幽靈車：每 0.1 秒記一次位置，破紀錄時存起來（只存在這台裝置，不同步） */
var GH = { rec: [], play: null, acc: 0, g: new THREE.Group(), spr: null };
GH.spr = spAttach(GH.g, SROW.girl, 48, 70, 2.7, 3.95, []); GH.spr.sp.material.opacity = .45; GH.spr.sp.material.depthWrite = false; GH.g.visible = false; scene.add(GH.g);
function ghostKey() { return 'snRaceGhost|' + recKey(TKI); }
function ghostReset() { GH.rec = []; GH.acc = 0; GH.play = null; if (!FREE) return; try { var a = JSON.parse(localStorage.getItem(ghostKey()) || 'null'); if (a && a.length > 10) GH.play = a; } catch (e) { } }
function ghostSave() { if (GH.rec.length < 10) return; try { localStorage.setItem(ghostKey(), JSON.stringify(GH.rec)); } catch (e) { } }
function ghostStep(dt, phase) {
  if (typeof GH === 'undefined' || !GH) return; var P = R[0]; GH.g.visible = false; if (!FREE) return;
  if (phase === 'play' && !S.winner) { GH.acc += dt; while (GH.acc >= .1) { GH.acc -= .1; GH.rec.push([Math.round(P.s * 10) / 10, Math.round(P.lat * 100) / 100]); } }
  var A = GH.play; if (!A || (phase !== 'play' && phase !== 'finish')) return;
  var f = S.race * 10, i = Math.floor(f); if (i >= A.length - 1) return;
  var u = f - i, s = A[i][0] + (A[i + 1][0] - A[i][0]) * u, lat = A[i][1] + (A[i + 1][1] - A[i][1]) * u;
  if (Math.abs(s - P.s) > 140) return;
  place(GH.g, s, lat, 0); GH.g.visible = true;
  if (SHEET_OK) { var fr = (Math.floor(s * .32) % 4 + 4) % 4; if (fr !== GH.spr.f) spRedraw(GH.spr, fr); }
}
if (window.__race) window.__race.ghost = GH;

addEventListener('message', function (e) { var d = e.data; if (!d || d.sunnuSfxVol == null) return; window.__sunnuSfxVol = d.sunnuSfxVol; try { window.__sunnuSfxApply(); } catch (x) { } });
if (EMBED) { document.body.classList.add('embed'); try { parent.postMessage({ chickenReady: 1 }, '*'); } catch (e) { } }
})();
