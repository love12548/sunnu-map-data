<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>孫女開飛機｜射擊測試 v7</title>
<style>
@font-face{font-family:Cubic11;src:url(https://cdn.jsdelivr.net/gh/ACh-K/Cubic-11@main/fonts/web/Cubic_11.woff2) format('woff2');font-display:swap}
:root{--ink:#3b2a1e;--paper:#fff6dc;--gold:#ffdd6c}
*{box-sizing:border-box}
html,body{margin:0;background:#f3e6c8;color:var(--ink);font:15px/1.4 Cubic11,"Noto Sans TC",system-ui,sans-serif;-webkit-user-select:none;user-select:none;touch-action:none}
.wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px}
h1{font-size:18px;margin:0 0 8px}
.game{position:relative;width:min(100%,360px);aspect-ratio:2/3;border:4px solid var(--ink);background:#000;box-shadow:0 6px 0 var(--ink);overflow:hidden}
canvas{display:block;width:100%;height:100%;image-rendering:pixelated;image-rendering:crisp-edges}
.ui{position:absolute;inset:0;pointer-events:none}
.bar{position:absolute;left:8px;right:8px;top:8px;display:flex;justify-content:space-between;gap:6px;font-weight:900;font-size:13px;color:var(--paper);text-shadow:1px 1px 0 var(--ink)}
.hp{position:absolute;left:8px;right:8px;top:34px;height:8px;border:2px solid var(--ink);background:var(--paper);display:none}
.hp i{display:block;height:100%;width:100%;background:#c0453c}
.hpname{position:absolute;left:8px;right:8px;top:22px;font-size:11px;font-weight:900;color:var(--paper);text-shadow:1px 1px 0 var(--ink);display:none}
.banner{position:absolute;left:0;right:0;top:36%;text-align:center;font-weight:900;font-size:20px;color:#fff6dc;text-shadow:2px 2px 0 var(--ink)}
.wep{position:absolute;left:8px;right:8px;top:50px;font-size:12px;font-weight:900;color:var(--gold);text-shadow:1px 1px 0 var(--ink)}
.status{position:absolute;left:8px;right:8px;bottom:44px;font-size:12px;font-weight:900;color:var(--gold);text-shadow:1px 1px 0 var(--ink);text-align:center}
.xp{position:absolute;left:8px;right:8px;bottom:32px;height:5px;border:2px solid var(--ink);background:var(--paper)}
.xp i{display:block;height:100%;width:0;background:#9fe8ff}
.xp span{position:absolute;right:0;top:-14px;font-size:10px;color:#9fe8ff;text-shadow:1px 1px 0 #3b2a1e}
.heat{position:absolute;left:8px;right:8px;bottom:14px;height:5px;border:2px solid var(--ink);background:var(--paper)}
.heat::before{content:'熱血';position:absolute;left:-2px;top:-14px;font-size:10px;color:#ff8a4c;text-shadow:1px 1px 0 #3b2a1e}
.heat.full::before{content:'熱血滿！雙擊超載';color:#ffdd6c}
.heat i{display:block;height:100%;width:0;background:#ff8a4c}
.heat.full i{background:#ffdd6c}
.prog{position:absolute;left:8px;right:8px;bottom:8px;height:5px;border:2px solid var(--ink);background:var(--paper)}
.prog i{display:block;height:100%;width:0;background:var(--gold)}
.card{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(20,14,8,.6)}
.card.on{display:flex}
.card > div{background:var(--paper);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:12px 14px;text-align:center;width:82%;max-height:92%;overflow:auto}
.card b{display:block;font-size:19px;margin-bottom:6px}
.card p{margin:4px 0 8px;font-size:13px}
.stamps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin:8px 0}
.stamps span{white-space:nowrap;border:2px solid var(--ink);padding:4px 2px;font-size:12px;background:#fffdf3}
.stamps span.got{background:var(--gold);font-weight:900}
.choice{display:block;width:100%;margin:6px 0;text-align:left}
@media(max-height:560px){.card>div{width:90%;padding:8px 10px;max-height:96%}.card b{font-size:16px;margin-bottom:3px}.card p{font-size:12px;margin:2px 0 4px;line-height:1.35}.choice{margin:4px 0;padding:5px 8px;font-size:12px}}
button{border:3px solid var(--ink);background:var(--gold);color:var(--ink);padding:10px 16px;box-shadow:0 4px 0 var(--ink);cursor:pointer;font:15px Cubic11,"Noto Sans TC",system-ui,sans-serif;border-radius:0}
button:active{transform:translateY(3px);box-shadow:none}
.fps{position:absolute;right:8px;top:4px;font:11px monospace;color:#fff6dc;background:rgba(0,0,0,.45);padding:2px 4px}
.help{margin-top:10px;font-size:13px;color:#6b5a4a;text-align:center;max-width:360px}

<div class="wrap">

      <button id="cbtn" type="button">開始</button>

</div>

  for (const sh of S.shots) if (sh.kind === 'pellet') { ctx.fillStyle = '#3b2a1e'; ctx.fillRect(Math.round(sh.x) - 2, Math.round(sh.y) - 2, 4, 4); ctx.fillStyle = '#ffdd6c'; ctx.fillRect(Math.round(sh.x) - 1, Math.round(sh.y) - 1, 2, 2); }
  // 雷電
  for (const sh of S.shots) if (sh.kind === 'bolt') {
    const a = Math.min(1, sh.t / .3 * 1.6);
    // 鋸齒路線：每 10px 一個折點，左右交替偏移
    const pts = [];
    for (let y = sh.y0; y <= sh.y1; y += 10) { const k = Math.floor(y / 10); const off = ((k * 7 + Math.floor(sh.seed)) % 5 - 2) * 4; pts.push({ x: sh.x + (k % 2 ? off : -off), y }); }
    pts.push({ x: sh.x, y: sh.y1 });
    // 外層：淡黃粗線；內層：白色細線（像素階梯）
    const seg = (w, col) => { ctx.fillStyle = col; for (let i = 0; i < pts.length - 1; i++) { const p = pts[i], q = pts[i + 1]; for (let y = p.y; y < q.y; y += 2) { const t = (y - p.y) / (q.y - p.y); const x = Math.round(p.x + (q.x - p.x) * t); ctx.fillRect(x - w / 2, y, w, 2); } } };
    ctx.globalAlpha = .9 * a; seg(7, '#ffdd6c');
    ctx.globalAlpha = a; seg(3, '#fff6dc');
    // 末端火花（打到的位置）
    ctx.fillStyle = '#fff6dc'; for (let i = 0; i < 6; i++) { const ang = i / 6 * Math.PI * 2 + sh.seed; ctx.fillRect(Math.round(sh.x + Math.cos(ang) * 8) - 1, Math.round(sh.y1 + Math.sin(ang) * 6) - 1, 3, 3); }
    ctx.globalAlpha = 1;
  }
  // 飛彈爆炸圓環
  for (const r of S.rings) { const k = Math.round(r.t / .35 * 10), rad = 4 + k * 2.5; ctx.fillStyle = k < 5 ? '#fff6dc' : '#ffb347'; ctx.fillRect(Math.round(r.x - rad), Math.round(r.y - rad), 2, 2); ctx.fillRect(Math.round(r.x + rad), Math.round(r.y + rad), 2, 2); ctx.fillRect(Math.round(r.x + rad), Math.round(r.y - rad), 2, 2); ctx.fillRect(Math.round(r.x - rad), Math.round(r.y + rad), 2, 2); ctx.fillRect(Math.round(r.x - rad + 2), Math.round(r.y - rad), rad * 2 - 4, 1); ctx.fillRect(Math.round(r.x - rad + 2), Math.round(r.y + rad), rad * 2 - 4, 1); }
  // 光束炮
  drawBeam();
  if (S.ev && S.ev.type === 'train') { const v = S.ev, x = Math.round(v.x); if (v.warn > 0) { ctx.fillStyle = (Math.floor(S.t * 14) % 2) ? 'rgba(255,90,90,.55)' : 'rgba(255,90,90,.2)'; ctx.fillRect(x - 14, 0, 28, H); } else for (let c = 0; c < 5; c++) { const cy = Math.round(v.y + c * 24); ctx.fillStyle = '#120d0a'; ctx.fillRect(x - 14, cy - 1, 28, 24); ctx.fillStyle = c ? '#fff6dc' : '#c0453c'; ctx.fillRect(x - 12, cy, 24, 22); ctx.fillStyle = '#9fe8ff'; ctx.fillRect(x - 8, cy + 4, 16, 4); ctx.fillRect(x - 8, cy + 13, 16, 4); } }
  drawLionFx();
  if (S.geys) for (const g of S.geys) { const x = Math.round(g.x), y = Math.round(g.y); if (g.warn > 0) { ctx.globalAlpha = .4 + .4 * (Math.floor(S.t * 12) % 2); ctx.fillStyle = '#ff3f1f'; ctx.fillRect(x - 18, y - 2, 36, 4); ctx.fillRect(x - 2, y - 18, 4, 36); ctx.fillRect(x - 14, y - 14, 4, 4); ctx.fillRect(x + 10, y - 14, 4, 4); ctx.fillRect(x - 14, y + 10, 4, 4); ctx.fillRect(x + 10, y + 10, 4, 4); ctx.globalAlpha = 1; } else { const r = 20; ctx.fillStyle = '#3b0a05'; ctx.fillRect(x - r, y - r, r * 2, r * 2); ctx.fillStyle = '#ff5a1f'; ctx.fillRect(x - r + 3, y - r + 3, r * 2 - 6, r * 2 - 6); ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 8, y - 8, 16, 16); ctx.fillStyle = '#fff3a0'; ctx.fillRect(x - 3, y - 24, 6, 18); } }
  if (S.wind) { ctx.fillStyle = 'rgba(255,246,220,.6)'; for (let i = 0; i < 14; i++) { const x = ((i * 41 + S.t * 220 * S.wind) % (W + 40) + W + 40) % (W + 40) - 20; ctx.fillRect(x | 0, (i * 19) % H, 16, 1); } }
  for (const r of S.rocks) {
    const x = Math.round(r.x), y = Math.round(r.y);
    if (r.met) {
      if (r.warn > 0) {           // 落點準星（像素圓圈縮小）
        const k = Math.round(6 + r.warn * 14), ty = Math.round(r.ty || S.py), c = (Math.floor(S.t * 12) % 2) ? '#ff5a1f' : '#ffd23f';
        ctx.fillStyle = c; ctx.fillRect(x - k, ty - 1, 6, 2); ctx.fillRect(x + k - 6, ty - 1, 6, 2); ctx.fillRect(x - 1, ty - k, 2, 6); ctx.fillRect(x - 1, ty + k - 6, 2, 6);
        ctx.globalAlpha = .25; ctx.fillRect(x - 1, 0, 2, ty); ctx.globalAlpha = 1;
      } else {                    // 火球：拖尾在上、岩心在下
        for (let i = 1; i <= 6; i++) { const w = 14 - i * 2; ctx.fillStyle = i < 3 ? '#ffd23f' : i < 5 ? '#ff8a4c' : '#c0453c'; ctx.globalAlpha = 1 - i * .12; ctx.fillRect(x - w / 2 + ((i * 3 + Math.floor(S.t * 30)) % 3 - 1), y - 8 - i * 6, w, 6); }
        ctx.globalAlpha = 1;
        ctx.fillStyle = '#3b0a05'; ctx.fillRect(x - 8, y - 8, 16, 16);
        ctx.fillStyle = '#5b2a1a'; ctx.fillRect(x - 7, y - 7, 14, 14);
        ctx.fillStyle = '#ff5a1f'; ctx.fillRect(x - 4, y - 2, 8, 2); ctx.fillRect(x - 1, y - 6, 2, 10); ctx.fillRect(x + 2, y + 3, 4, 2);
        ctx.fillStyle = '#ffd23f'; ctx.fillRect(x - 2, y - 7, 4, 3);
      }
      continue;
    }
    if (r.warn > 0) { ctx.globalAlpha = .5 + .3 * Math.sin(S.t * 30); ctx.fillStyle = '#3b2a1e'; ctx.fillRect(x - 9, Math.round(S.py) + 10, 18, 4); ctx.fillStyle = '#ff5a5a'; ctx.fillRect(x - 1, 0, 2, H); ctx.globalAlpha = 1; }
    else { ctx.fillStyle = '#3b2a1e'; ctx.fillRect(x - 8, y - 8, 16, 16); ctx.fillStyle = '#c9a27e'; ctx.fillRect(x - 7, y - 7, 14, 14); ctx.fillStyle = '#9a7862'; ctx.fillRect(x - 3, y - 2, 4, 3); ctx.fillRect(x + 2, y + 3, 3, 2); }
  }

  // 飛機殘影 + 本體
  if (S.superT > 0 || S.weapon) S.ghost.forEach((g, i) => { if (i === 0) return; ctx.globalAlpha = .22 - i * .05; ctx.drawImage(sp('ship', S.superT > 0 ? 'tgold' : ''), Math.round(g.x - 16), Math.round(g.y - 16), 32, 32); });
  ctx.globalAlpha = 1;
  if (S.state !== 'lose') {
    ctx.globalAlpha = S.inv > 0 ? .5 : 1;
    const sx = Math.round(S.px), sy = Math.round(S.py), flap = Math.floor(S.t * 14) % 2;
    for (let w = 0; w < S.wings; w++) { const wx = sx + (w ? 24 : -24), wy = sy + 6 + (flap ? 1 : 0); ctx.fillStyle = '#ff8a4c'; ctx.fillRect(wx - 2, wy + 7, 4, 3 + flap * 2); for (const [ox, oy] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) ctx.drawImage(sp('boss_corgi_ko', 'dark'), wx - 8 + ox, wy - 8 + oy, 16, 16); ctx.drawImage(sp('boss_corgi_ko'), wx - 8, wy - 8, 16, 16); }
    // 大翅膀（像素羽毛，上下拍動，每格 2px 對齊柯基的像素大小）
    const WING = flap ? ['.kkkkk..', 'kWuuuukk', 'kkWWuuuk', '..kkWWuk', '....kkWk', '......kk'] : ['......kk', '....kkWk', '..kkWWuk', 'kkWWuuuk', 'kWuuuukk', '.kkkkk..'];
    const WC = { k: '#3b2a1e', W: '#fff6dc', u: '#9fe8ff' };
    WING.forEach((row, ry) => [...row].forEach((ch, rx) => {
      if (!WC[ch]) return; ctx.fillStyle = WC[ch];
      ctx.fillRect(sx - 14 - (8 - rx) * 2, sy - 8 + ry * 2, 2, 2);   // 左翼
      ctx.fillRect(sx + 14 + (7 - rx) * 2 - 0, sy - 8 + ry * 2, 2, 2); // 右翼（鏡像）
    }));
    // 屁股噴火（三道火舌，長短閃動）
    const fk = Math.floor(S.t * 24) % 3;
    [[-6, 6 + fk * 2], [0, 10 + ((fk + 1) % 3) * 3], [6, 6 + ((fk + 2) % 3) * 2]].forEach(([dx, len]) => {
      ctx.fillStyle = '#c0453c'; ctx.fillRect(sx + dx - 2, sy + 14, 4, len);
      ctx.fillStyle = '#ff8a4c'; ctx.fillRect(sx + dx - 2, sy + 14, 4, len - 2);
      ctx.fillStyle = '#ffdd6c'; ctx.fillRect(sx + dx - 1, sy + 14, 2, Math.max(2, len - 5));
    });
    if (S.superT > 0) { ctx.globalAlpha = .8; for (const [dx, dy] of [[-2, 0], [2, 0], [0, -2], [0, 2]]) ctx.drawImage(sp('ship', 'tgold'), sx - 16 + dx, sy - 16 + dy, 32, 32); ctx.globalAlpha = S.inv > 0 ? .5 : 1; }
    ctx.drawImage(sp('ship', S.slowMove > 0 ? 'blue' : ''), sx - 16, sy - 16, 32, 32);
    ctx.globalAlpha = 1;
  }
  if (S.weapon && S.wepT < 900) { ctx.strokeStyle = '#9fe8ff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(S.px), Math.round(S.py), 24, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * Math.max(0, S.wepT / 10)); ctx.stroke(); }
  if (S.weapon === 'beam' && S.charge > 0) { ctx.strokeStyle = '#ffdd6c'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(S.px), Math.round(S.py), 22, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * S.charge); ctx.stroke(); }
  if (S.superT > 0) { ctx.strokeStyle = 'rgba(255,221,108,' + (.5 + .4 * Math.sin(S.t * 20)).toFixed(2) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(S.px), Math.round(S.py), 20, 0, Math.PI * 2); ctx.stroke(); }
  if (S.shield > 0) { ctx.strokeStyle = 'rgba(143,227,154,' + (.5 + .3 * Math.sin(S.t * 12)).toFixed(2) + ')'; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(Math.round(S.px), Math.round(S.py), 18, 0, Math.PI * 2); ctx.stroke(); }
  for (const p of S.parts) {
    if (p.boom !== undefined) {
      const f = Math.min(2, Math.floor(p.boom / .11)), r = (p.big ? 6 : 3) + f * (p.big ? 6 : 4);
      ctx.fillStyle = f === 0 ? '#fff6dc' : f === 1 ? '#ffdd6c' : '#c0453c';
      ctx.fillRect(Math.round(p.x) - r, Math.round(p.y) - 1, r * 2, 2); ctx.fillRect(Math.round(p.x) - 1, Math.round(p.y) - r, 2, r * 2);
      ctx.fillRect(Math.round(p.x) - r + 2, Math.round(p.y) - r + 2, 2, 2); ctx.fillRect(Math.round(p.x) + r - 4, Math.round(p.y) + r - 4, 2, 2);
    } else { ctx.fillStyle = p.c; ctx.fillRect(Math.round(p.x), Math.round(p.y), p.s || 2, p.s || 2); }
  }
  if (S.state === 'play' && S.t < 9 && !S.boss) {
    const tip = S.t < 3 ? '👆 拖曳移動' : S.t < 6 ? '撿道具換武器' : '熱血滿了 雙擊超載';
    ctx.font = '11px Cubic11,"Noto Sans TC",sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(59,42,30,.7)'; ctx.fillRect(30, H - 78, W - 60, 16);
    ctx.fillStyle = '#ffdd6c'; ctx.fillText(tip.replace('👆 ', ''), W / 2, H - 66);
  }
  ctx.restore();
  for (const sm of S.smoke) { const a = Math.min(1, sm.t) * .85; ctx.globalAlpha = a; ctx.fillStyle = '#d9d2c4'; for (let i = 0; i < 6; i++) { const ox = Math.cos(i + S.t) * 12, oy = Math.sin(i * 1.7 + S.t) * 8; ctx.fillRect(Math.round(sm.x + ox) - 16, Math.round(sm.y + oy) - 10, 32, 20); } ctx.globalAlpha = 1; }
  drawBossCinema();
  if (S.lives === 1) ctx.drawImage(VIG, 0, 0);
  ctx.font = 'bold 10px Cubic11,"Noto Sans TC",sans-serif'; ctx.textAlign = 'center';
  for (const q of S.pops) { ctx.fillStyle = '#3b2a1e'; ctx.fillText(q.txt, Math.round(q.x) + 1, Math.round(q.y) + 1); ctx.fillStyle = q.c; ctx.fillText(q.txt, Math.round(q.x), Math.round(q.y)); }
  if (S.flash > 0) { ctx.fillStyle = 'rgba(255,246,220,' + Math.min(.22, S.flash * .6).toFixed(2) + ')'; ctx.fillRect(0, 0, W, H); }
}

// ---------- HUD（只在數值改變時才寫 DOM）----------
const HUD = { score: null, lives: null, hpw: null, wep: null, status: null, heat: null, prog: null, heatFull: null };
const $ = id => document.getElementById(id);
function hud() {
  const xk = S.plv * 1000 + Math.round(S.xp / S.xpNeed * 100);
  if (HUD.xp !== xk) { HUD.xp = xk; $('xpi').style.width = Math.min(100, S.xp / S.xpNeed * 100) + '%'; $('xpl').textContent = 'Lv ' + S.plv; }
  if (HUD.score !== S.score) { HUD.score = S.score; $('score').textContent = '分數 ' + S.score; }
  if (HUD.lives !== S.lives) { HUD.lives = S.lives; const hw = $('hearts'); hw.textContent = '❤'.repeat(Math.max(0, S.lives)) + '♡'.repeat(Math.max(0, S.maxLives - S.lives)); }
  const bossOn = !!(S.boss || S.mini);
  const bw = S.boss ? S.boss.hp / S.boss.max : S.mini ? S.mini.hp / S.mini.max : 0;
  const hpKey = bossOn ? Math.round(bw * 200) + (S.boss ? S.boss.life * 1000 : 0) : -1;
  if (HUD.hpw !== hpKey) { HUD.hpw = hpKey; $('bhp').style.display = bossOn ? 'block' : 'none'; $('bname').style.display = bossOn ? 'block' : 'none'; $('bname').textContent = S.boss ? '風獅爺 ' + '●'.repeat(3 - S.boss.life) + '○'.repeat(S.boss.life) : S.mini ? S.mini.name : ''; $('bhpi').style.width = (bw * 100) + '%'; }
  const wtxt = S.weapon ? WEAPON[S.weapon].name + ' ' + Math.ceil(S.wepT) + 's' : '';
  if (HUD.wep !== wtxt) { HUD.wep = wtxt; $('wep').textContent = wtxt; }
  const st = [];
  if (S.shield > 0) st.push('護盾');
  if (S.superT > 0) st.push('超載 ' + Math.ceil(S.superT));
  if (S.combo >= 5) st.push('連擊 ×' + (1 + Math.floor(S.combo / 5)) + '（' + S.combo + '）');
  const stxt = st.join('　');
  if (HUD.status !== stxt) { HUD.status = stxt; $('status').textContent = stxt; }
  const heatKey = Math.round(S.heat);
  if (HUD.heat !== heatKey) { HUD.heat = heatKey; $('heati').style.width = S.heat + '%'; const full = S.heat >= 100; if (HUD.heatFull !== full) { HUD.heatFull = full; $('heat').classList.toggle('full', full); } }
  const pr = bossOn ? 100 : Math.min(100, S.lvT / LEVEL_LEN * 100), prKey = Math.round(pr);
  if (HUD.prog !== prKey) { HUD.prog = prKey; $('prog').style.width = prKey + '%'; }
}

// ---------- 迴圈（固定步長）----------
let fpsOn = /fps=1/.test(location.search), fpsN = 0, fpsT = 0, fpsMs = 0, fpsLast = 0;
let perf = { max: 0, step: 0, draw: 0, hud: 0, n: 0, long: 0, win: 0 };
function frame(ts) {
  if (!lastTS) lastTS = ts;
  let frameDt = Math.min(.1, (ts - lastTS) / 1000); lastTS = ts;
  if (fpsOn) { fpsN++; fpsT += ts - (fpsLast || ts); fpsLast = ts; if (fpsT >= 500) { $('fps').textContent = 'FPS ' + Math.round(fpsN * 1000 / fpsT) + '｜子彈 ' + S.eb.length; $('fps').style.display = ''; fpsN = 0; fpsT = 0; } }
  accum += frameDt * (EMB ? 1.2 : 1);
  let steps = 0;
  const t0 = performance.now();
  while (accum >= DT && steps < 6) { step(DT); accum -= DT; steps++; }
  if (steps >= 6) accum = 0;
  const t1 = performance.now();
  draw(); pickMusic();
  const t2 = performance.now();
  hud();
  const t3 = performance.now();
  if (fpsOn) { perf.step += t1 - t0; perf.draw += t2 - t1; perf.hud += t3 - t2; perf.n++; const ft = frameDt * 1000; if (ft > perf.max) perf.max = ft; if (ft > 33) perf.long++; perf.win += ft; if (perf.win > 1000) { $('fps').textContent = '最長一幀 ' + Math.round(perf.max) + 'ms｜卡幀 ' + perf.long + '｜邏輯 ' + (perf.step / perf.n).toFixed(2) + ' 繪圖 ' + (perf.draw / perf.n).toFixed(2) + ' ms｜子彈 ' + S.eb.length + (muted ? '｜靜音' : ''); perf = { max: 0, step: 0, draw: 0, hud: 0, n: 0, long: 0, win: 0 }; } }
  requestAnimationFrame(frame);
}

// ---------- 輸入 ----------
const g = document.getElementById('g');
function toLogical(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H }; }
g.addEventListener('pointerdown', e => {
  if (e.target.closest('button')) return;
  const now = performance.now();
  if (S.state === 'ready') { start(); return; }
  if (now - lastTap < 320) activateSuper();
  lastTap = now;
  pointer = toLogical(e);
});
g.addEventListener('pointermove', e => { if (pointer) pointer = toLogical(e); });
window.addEventListener('pointerup', () => { pointer = null; });
window.addEventListener('pointercancel', () => { pointer = null; });
$('cbtn').addEventListener('click', () => start(0));
// 已解鎖的關卡可以直接選
(() => { let u = 0; try { u = +localStorage.getItem('sunnuShooterLevel') || 0; } catch (e) {} const box = $('cchoices'); for (let i = 1; i <= u; i++) { const b = document.createElement('button'); b.type = 'button'; b.className = 'choice'; b.textContent = '從' + LEVELS[i].name + '開始'; b.onclick = () => start(i); box.appendChild(b); } })();
const KM = { ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down' };
window.addEventListener('keydown', e => {
  if (KM[e.key]) { keys[KM[e.key]] = true; e.preventDefault(); }
  if ((e.key === 'x' || e.key === 'X') && S.state === 'play') activateSuper();
  if (e.key === 'd' || e.key === 'D') fpsOn = !fpsOn;
  if (e.key === 'm' || e.key === 'M') muted = !muted;
  if (!EMB && (e.key === 'b' || e.key === 'B') && S.state === 'play' && !S.boss) jumpBoss();
  if ((e.key === ' ' || e.key === 'f' || e.key === 'F') && (S.state === 'ready' || S.state === 'win' || S.state === 'lose')) { start(); e.preventDefault(); }
});
window.addEventListener('keyup', e => { if (KM[e.key]) keys[KM[e.key]] = false; });

requestAnimationFrame(t => { lastTS = t; frame(t); });
</script>
