<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>翻翻樂</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>

:root{--gold:#f2c94c;--gold2:#8a6a14;--nt:polygon(0 4px,4px 4px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 4px) calc(100% - 4px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 4px),0 calc(100% - 4px));--nt2:polygon(0 3px,3px 3px,3px 0,calc(100% - 3px) 0,calc(100% - 3px) 3px,100% 3px,100% calc(100% - 3px),calc(100% - 3px) calc(100% - 3px),calc(100% - 3px) 100%,3px 100%,3px calc(100% - 3px),0 calc(100% - 3px))}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:#05030c;color:#fff;font-family:"DotGothic16","PingFang TC","Noto Sans TC",monospace;overflow:hidden;touch-action:manipulation;-webkit-user-select:none;user-select:none}
img{image-rendering:pixelated}
#app{width:100vw;height:100vh;height:100svh;position:relative;overflow:hidden;background:linear-gradient(#0a0520,#160a3d 55%,#2a0f55)}
/* ===== 宇宙場景 ===== */
.sp1,.sp2,.sp3{position:absolute;inset:-40px;pointer-events:none}
.sp1{background-image:radial-gradient(#fff 1px,transparent 1.6px);background-size:53px 53px;background-position:7px 11px;animation:tw 3s steps(3) infinite,drift 60s linear infinite}
.sp2{background-image:radial-gradient(#ffe9a0 1.3px,transparent 2px),radial-gradient(#9fd8ff 1px,transparent 1.6px);background-size:97px 97px,67px 67px;background-position:30px 40px,5px 70px;animation:tw 2.3s steps(2) infinite reverse,drift 90s linear infinite reverse}
.sp3{background-image:radial-gradient(#fff 2px,transparent 2.6px);background-size:151px 151px;background-position:60px 20px;animation:tw 1.7s steps(2) infinite,drift 36s linear infinite}
@keyframes tw{50%{opacity:.35}}
@keyframes drift{to{transform:translateY(53px)}}
.neb{position:absolute;border-radius:50%;filter:blur(34px);opacity:.55;pointer-events:none}
.neb.a{width:300px;height:240px;left:-90px;top:60px;background:radial-gradient(#ff4fa3,#0000 70%);animation:nb 16s ease-in-out infinite alternate}
.neb.b{width:280px;height:260px;right:-100px;top:300px;background:radial-gradient(#3fa9ff,#0000 70%);animation:nb 20s ease-in-out infinite alternate-reverse}
.neb.c{width:240px;height:200px;left:20%;bottom:-40px;background:radial-gradient(#8a4dff,#0000 70%);animation:nb 14s ease-in-out infinite alternate}
@keyframes nb{to{transform:translate(30px,-26px) scale(1.15)}}
.planet{position:absolute;right:-22px;top:150px;width:96px;height:96px;border-radius:50%;background:radial-gradient(circle at 32% 30%,#ffd9a0 0,#f08a4b 45%,#8c2f5a 100%);box-shadow:inset -14px -10px 0 #0004;animation:fl2 8s steps(16) infinite alternate;pointer-events:none}
.planet::before{content:"";position:absolute;left:-26px;right:-26px;top:38px;height:20px;border-radius:50%;border:5px solid #ffd9a0aa;transform:rotate(-16deg)}
.moon{position:absolute;left:12px;top:224px;width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff,#b9bfd9 60%,#6d7499);box-shadow:inset -5px -4px 0 #0003;animation:fl2 6s steps(12) infinite alternate-reverse;pointer-events:none}
@keyframes fl2{to{transform:translateY(-12px)}}
.ast{position:absolute;width:12px;height:12px;background:#8f8a99;border:2px solid #3a3544;animation:spin 7s steps(8) infinite,fl2 5s steps(10) infinite alternate;pointer-events:none}
@keyframes spin{to{rotate:360deg}}
.shoot{position:absolute;width:90px;height:3px;background:linear-gradient(90deg,#fff0,#fff);box-shadow:0 0 8px #fff;transform:rotate(28deg);animation:sh 1s linear forwards;pointer-events:none;z-index:1}
@keyframes sh{from{opacity:1;translate:0 0}to{opacity:0;translate:260px 140px}}
#shake{position:absolute;inset:0;display:flex;flex-direction:column;will-change:transform}
/* ===== LP ===== */
.lp{position:relative;z-index:3;margin:6px 8px 0;padding:4px 8px;background:linear-gradient(#2d1f66,#150d35);clip-path:var(--nt);border:0;display:flex;align-items:center;gap:8px;font-size:13px;box-shadow:inset 0 0 0 3px var(--gold)}
.lp b{min-width:64px;color:var(--gold)}
.lp .bar{flex:1;height:12px;background:#000;border:1px solid #6b5a2a;position:relative;overflow:hidden}
.lp .bar i{position:absolute;inset:0;width:100%;background:repeating-linear-gradient(90deg,#4ef08a 0 6px,#2fbf68 6px 8px);transition:width .5s steps(8)}
.lp .bar i.lag{background:#ffd23f;transition:width 1.2s .6s steps(10)}
.lp em{font-style:normal;min-width:44px;text-align:right;font-size:15px}
.sh{display:none;filter:drop-shadow(0 0 6px #6cf)}.sh.on{display:inline}
/* ===== 角色 ===== */
.side{position:relative;height:104px;z-index:2;flex:none}
.pad{position:absolute;left:50%;bottom:-2px;width:130px;height:30px;margin-left:-65px;border-radius:50%;background:radial-gradient(#7fe9ff66,#7fe9ff11 60%,#0000 72%);border:2px solid #7fe9ffaa;box-shadow:0 0 18px #4fd0ff88;animation:pad 2s steps(4) infinite alternate}
.pad::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed #7fe9ff88;animation:spin 6s linear infinite}
@keyframes pad{to{box-shadow:0 0 30px #4fd0ffcc;opacity:.8}}
.fig{position:absolute;bottom:10px;left:50%;width:84px;height:84px;margin-left:-42px;filter:drop-shadow(0 0 10px #fff5);animation:bob 1.6s steps(2) infinite}
.fig img{width:100%;height:100%}
.foe .fig{width:96px;height:96px;margin-left:-48px}
@keyframes bob{50%{transform:translateY(-5px)}}
.fig.hit{animation:hit .6s steps(10)}
@keyframes hit{0%{transform:scale(1.25);filter:brightness(5) drop-shadow(0 0 20px #fff)}20%{transform:translate(-22px,6px) rotate(-14deg) scale(.92);filter:brightness(2.2) saturate(2)}45%{transform:translate(12px,-4px) rotate(6deg)}70%{transform:translate(-5px) rotate(-2deg)}100%{transform:none}}
.fig.crack1{filter:drop-shadow(0 0 10px #fff5) contrast(1.15)}
.fig.crack2{filter:drop-shadow(0 0 10px #f554) contrast(1.35) sepia(.4)}
.fig.crack3{filter:drop-shadow(0 0 10px #f00a) contrast(1.6) sepia(.7) saturate(2);animation:bob .5s steps(2) infinite}
/* ===== 全息場地 ===== */
.field{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center;perspective:760px;z-index:1}
.floor{position:absolute;left:-8%;right:-8%;top:6%;bottom:2%;transform:rotateX(52deg);background:linear-gradient(#0000 0,#0007 100%),repeating-linear-gradient(0deg,#5fe8ff33 0 2px,#0000 2px 36px),repeating-linear-gradient(90deg,#5fe8ff33 0 2px,#0000 2px 36px),radial-gradient(ellipse at 50% 50%,#3b2f9a99 0,#1a124588 70%);border:3px solid #5fe8ffaa;box-shadow:0 0 36px #5fe8ff66 inset,0 0 30px #5fe8ff44;overflow:hidden}
.floor::after{content:"";position:absolute;left:0;right:0;height:50px;background:linear-gradient(#0000,#7fe9ff55,#0000);animation:scan 3.6s linear infinite}
@keyframes scan{from{top:-60px}to{top:100%}}
.board{position:relative;display:grid;grid-template-columns:repeat(4,1fr);gap:7px;width:min(78%,296px);transform:rotateX(24deg);transform-style:preserve-3d}
.card{position:relative;aspect-ratio:3/4.1;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,1.5,.5,1);cursor:pointer;border:0;background:none;padding:0}
.card::after{content:"";position:absolute;inset:6px -2px -8px;background:#0009;filter:blur(5px);transform:translateZ(-3px);z-index:-1}
.card.up::after{display:none}
.card:active{transform:translateY(2px)}
.card.up{transform:rotateY(180deg) translateZ(16px)}
.card.gone{visibility:hidden}
.card.pk{animation:pk .5s steps(4) 2}
@keyframes pk{50%{filter:brightness(2.4)}}
.card.swirl{animation:swl .8s steps(10)}
@keyframes swl{0%{transform:rotate(0) scale(1)}50%{transform:rotate(180deg) scale(.4)}100%{transform:rotate(360deg) scale(1)}}
.fig.frozen{filter:drop-shadow(0 0 12px #7fe6ff) brightness(1.3) saturate(.4) hue-rotate(160deg);animation:none}
.fig.pow{filter:drop-shadow(0 0 14px #ffe14d) brightness(1.2)}
.shadow{position:absolute;width:30px;height:12px;margin:-6px -15px;border-radius:50%;background:#000a;animation:shw .3s linear forwards}
@keyframes shw{to{transform:scale(7)}}
.card.idle .bk .bi{animation:cb2 2s steps(2) infinite;animation-delay:var(--d,0s)}
@keyframes cb2{50%{transform:translateY(-3px)}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:linear-gradient(135deg,#fff3b0,#f2c94c 45%,#a8791a);clip-path:var(--nt)}
.face>.in{position:absolute;inset:3px;clip-path:var(--nt2);overflow:hidden}
/* ===== 牌背（5 款） ===== */
.bk .in{display:flex;align-items:center;justify-content:center}
.bk .bi{width:70%;height:auto;position:relative;z-index:2;filter:drop-shadow(0 2px 0 #0006)}
.bk .tg{position:absolute;bottom:3px;left:0;right:0;text-align:center;font-size:8px;letter-spacing:1px;color:#fff;text-shadow:1px 1px 0 #000,-1px 1px 0 #000,1px -1px 0 #000,-1px -1px 0 #000;z-index:3}
.bk .sp{position:absolute;width:7px;height:7px;background:#fff;clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);z-index:3;animation:tw 1.2s steps(2) infinite}
.bk .sp.s1{left:12%;top:14%}.bk .sp.s2{right:12%;top:30%;animation-delay:.4s}.bk .sp.s3{left:18%;bottom:24%;animation-delay:.8s}
.b1 .in{background:repeating-linear-gradient(135deg,#ff7ac8 0 8px,#ffa6dc 8px 16px)}
.b1 .bi{width:78%}
.b2 .in{background:radial-gradient(#fff6 0 2.5px,#0000 3px) 0 0/12px 12px,#3cc9d6}
.b2 .bi{width:84%}
.b3 .in{background:radial-gradient(#fff 1px,#0000 1.6px) 0 0/16px 16px,radial-gradient(#9fd8ff 1px,#0000 1.6px) 8px 8px/22px 22px,linear-gradient(#17104a,#3a1d7a)}
.b3 .pl{position:absolute;left:14%;top:18%;width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffd9a0,#f08a4b 55%,#8c2f5a);box-shadow:inset -4px -3px 0 #0004}
.b3 .pl::after{content:"";position:absolute;left:-30%;right:-30%;top:40%;height:22%;border-radius:50%;border:3px solid #ffe9bbcc;transform:rotate(-18deg)}
.b3 .bi{position:absolute;width:44%;right:10%;bottom:16%;animation:rk 2s steps(4) infinite}
@keyframes rk{50%{transform:translate(2px,-4px)}}
.b4 .in{background:conic-gradient(#7fd1ff 25%,#aee6ff 0 50%,#7fd1ff 0 75%,#aee6ff 0) 0 0/16px 16px}
.b4 .qb{width:62%;aspect-ratio:1;background:#ffcb2e;border:3px solid #7a3f00;box-shadow:inset -4px -4px 0 #e08a00,inset 3px 3px 0 #fff3a0;display:flex;align-items:center;justify-content:center;font-size:26px;color:#fff;text-shadow:2px 2px 0 #7a3f00,-1px -1px 0 #7a3f00;position:relative;z-index:2;animation:qb 1.4s steps(4) infinite}
.b4 .qb::before,.b4 .qb::after{content:"";position:absolute;width:4px;height:4px;background:#7a3f00;top:3px;left:3px;box-shadow:calc(100% + 24px) 0 #7a3f00}
@keyframes qb{50%{transform:translateY(-5px)}}
.b5 .in{background:radial-gradient(#ffffff22 0 2px,#0000 3px) 0 0/14px 14px,linear-gradient(#5b3a99,#2b1760)}
.b5 .bi{width:76%}
.thumbs{display:flex;gap:6px;margin:0 8px 4px;z-index:3;align-items:flex-end;justify-content:center}
.thumb{position:relative;width:34px;height:46px;border:0;background:none;padding:0;cursor:pointer;opacity:.55}
.thumb.on{opacity:1;transform:translateY(-4px)}
.thumb .face{position:absolute}
.thumb .bi{width:72%}
.thumb .tg,.thumb .sp{display:none}
.thumb .qb{font-size:12px;border-width:2px}
/* ===== 牌面 ===== */
.fr{transform:rotateY(180deg)}
.fr .in{background:linear-gradient(var(--c),var(--c2));display:flex;flex-direction:column;padding:4px;gap:3px}
.fr{filter:saturate(1.2) brightness(1.06)}
.fr .in::before{content:"";position:absolute;inset:0;background:linear-gradient(115deg,#fff0 30%,#fff6 46%,#fff0 60%);background-size:250% 100%;animation:foil 2.4s linear infinite;mix-blend-mode:screen;pointer-events:none;z-index:4}
@keyframes foil{from{background-position:120% 0}to{background-position:-120% 0}}
.fr .nm{font-size:10px;line-height:1;background:linear-gradient(#fffc,#fff6);color:#1a1030;padding:2px 3px;border:1px solid #0006;white-space:nowrap;overflow:hidden;display:flex;justify-content:space-between;align-items:center}
.fr .nm s{width:9px;height:9px;border-radius:50%;background:var(--o);border:1px solid #000;flex:none}
.fr .art{flex:1;min-height:0;background:radial-gradient(#fff 0,#fff 45%,var(--c2) 130%);border:2px solid #000;display:flex;align-items:center;justify-content:center;box-shadow:inset 0 0 0 1px #fff9}
.fr .art img{width:84%;height:84%;object-fit:contain}
.fr .st{font-size:9px;line-height:1;text-align:center;background:#fff;color:#2a1650;padding:3px 2px;border:2px solid #2a1650;font-weight:bold;white-space:nowrap;overflow:hidden}
.t-atk{--c:#ffb347;--c2:#ffe0a8;--o:#ff7a2f}.t-bomb{--c:#ff6b6b;--c2:#ffc9c9;--o:#f33}.t-heal{--c:#5fe39a;--c2:#c8fadf;--o:#2fd26f}.t-shield{--c:#5aaeff;--c2:#cfe8ff;--o:#3a9bff}.t-peek{--c:#b48cff;--c2:#e6d8ff;--o:#a06bff}.t-plunder{--c:#ff7ad0;--c2:#ffd0ee;--o:#ff4fb8}.t-skip{--c:#7fe6ff;--c2:#dff8ff;--o:#3fd0ff}.t-power{--c:#ffe14d;--c2:#fff5b8;--o:#ffc400}.t-shuffle{--c:#58e0c8;--c2:#cdf7ef;--o:#1fc9a8}.t-lucky{--c:#ff9bb8;--c2:#ffe0ea;--o:#ff5f8d}
#dex{position:absolute;inset:0;z-index:30;background:#0a0620f2;display:none;flex-direction:column}
#dex.on{display:flex}
.dh{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;font-size:14px;color:var(--gold)}
.dh button{font:inherit;font-size:12px;padding:4px 10px;background:#2a1d5a;color:#ffe27a;border:2px solid var(--gold)}
.dsc{flex:1;overflow:auto;padding:0 8px 16px}
.dsc h5{margin:10px 0 6px;font-size:13px;color:#fff;font-weight:normal;border-left:4px solid var(--gold);padding-left:6px}
.dg{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.dc{position:relative;aspect-ratio:3/4.1;border:0;background:none;padding:0;cursor:pointer}
.dc .face{backface-visibility:visible;transform:none}
.dc .nm{font-size:9px}.dc .st{font-size:8px;padding:2px 1px}
/* ===== 特效層 ===== */
#fx{position:absolute;inset:0;z-index:20;pointer-events:none;overflow:hidden}
.slow #fx *{animation-duration:1.6s!important}
.freeze #fx *,.freeze .fig{animation-play-state:paused!important}
.dim{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,#0000 20%,#000c 100%);opacity:0;transition:opacity .25s}
.flash{position:absolute;inset:0;background:#fff;opacity:0;animation:fl .4s steps(6) forwards}
@keyframes fl{0%{opacity:.7}100%{opacity:0}}
.redv{position:absolute;inset:0;box-shadow:inset 0 0 90px 34px #f22;opacity:0;animation:fl .7s steps(7) forwards}
.sum{position:absolute;width:120px;height:120px;margin:-60px 0 0 -60px;z-index:3}
.sum img{width:100%;height:100%;filter:drop-shadow(0 0 18px #ffe27a);animation:pop .55s steps(8) forwards}
@keyframes pop{0%{transform:scale(.1) rotate(-30deg)}60%{transform:scale(1.35) rotate(6deg)}100%{transform:scale(1.1)}}
.charge{position:absolute;width:30px;height:30px;margin:-15px;border-radius:50%;border:4px solid #ffe27a;animation:chg .7s steps(7) forwards;box-shadow:0 0 12px #ffe27a}
@keyframes chg{0%{transform:scale(7);opacity:0}30%{opacity:1}100%{transform:scale(.3);opacity:1}}
.beam{position:absolute;width:80px;height:520px;margin-left:-40px;bottom:50%;background:linear-gradient(#0000,#fff8,#ffe27acc);animation:bam .9s steps(9) forwards}
@keyframes bam{0%{opacity:0;transform:scaleX(.2)}25%{opacity:1;transform:scaleX(1)}100%{opacity:0;transform:scaleX(.1)}}
.banner{position:absolute;left:0;right:0;top:38%;height:52px;display:flex;align-items:center;justify-content:center;font-size:26px;letter-spacing:4px;color:#ffe27a;background:linear-gradient(90deg,#0000,#190a3aee 18%,#190a3aee 82%,#0000);border-top:3px solid var(--gold);border-bottom:3px solid var(--gold);text-shadow:3px 3px 0 #000,0 0 14px #f90;animation:ban 1.3s steps(13) forwards;z-index:5}
.banner small{font-size:11px;letter-spacing:1px;margin-left:10px;padding:2px 6px;background:var(--o,#f80);color:#fff;text-shadow:1px 1px 0 #000}
@keyframes ban{0%{transform:translateX(-110%)}16%{transform:translateX(0)}84%{transform:translateX(0);opacity:1}100%{transform:translateX(110%);opacity:0}}
.dmg{position:absolute;font-size:48px;color:#fff;text-shadow:3px 3px 0 #d11,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 0 16px #f33;animation:dm 1.2s steps(14) forwards;z-index:9;white-space:nowrap}
.dmg.heal{text-shadow:3px 3px 0 #1a7,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,0 0 14px #4ef08a}
@keyframes dm{0%{transform:scale(.3) translateY(14px);opacity:0}12%{transform:scale(2) rotate(-6deg);opacity:1}26%{transform:scale(1) rotate(2deg)}38%{transform:scale(1.15) translateY(-6px)}85%{opacity:1}100%{opacity:0;transform:translateY(-54px)}}
.comic{position:absolute;font-size:40px;color:#ffe933;letter-spacing:2px;text-shadow:4px 4px 0 #e22,-3px -3px 0 #000,3px -3px 0 #000,-3px 3px 0 #000,3px 3px 0 #000;animation:cm .8s steps(8) forwards;z-index:8;white-space:nowrap}
@keyframes cm{0%{transform:scale(.2) rotate(-20deg);opacity:0}20%{transform:scale(1.6) rotate(-8deg);opacity:1}40%{transform:scale(1) rotate(-6deg)}80%{opacity:1}100%{transform:scale(1.2) rotate(-6deg);opacity:0}}
.rays{position:absolute;width:340px;height:340px;margin:-170px;border-radius:50%;background:repeating-conic-gradient(var(--rc,#fff) 0 6deg,#0000 6deg 18deg);-webkit-mask:radial-gradient(#000 12%,#0000 68%);mask:radial-gradient(#000 12%,#0000 68%);animation:ry .6s steps(8) forwards}
@keyframes ry{0%{transform:scale(.2) rotate(0);opacity:1}100%{transform:scale(1.5) rotate(40deg);opacity:0}}
.ring{position:absolute;border-radius:50%;border:6px solid var(--rc,#fff);box-shadow:0 0 16px var(--rc,#fff);animation:rg .6s steps(7) forwards}
@keyframes rg{0%{transform:scale(.1);opacity:1}100%{transform:scale(1);opacity:0}}
.core{position:absolute;width:40px;height:40px;margin:-20px;background:#fff;border-radius:50%;box-shadow:0 0 0 8px #fff3a0,0 0 0 20px #ffb02e,0 0 0 34px #ff5a1f,0 0 50px 40px #d11;animation:co .7s steps(8) forwards}
@keyframes co{0%{transform:scale(.2)}35%{transform:scale(2.6)}100%{transform:scale(3.4);opacity:0}}
.px{position:absolute;width:8px;height:8px;background:var(--pc,#ffe27a);border:1px solid #0008;animation:pxa .9s steps(10) forwards}
.px.star{clip-path:polygon(50% 0,62% 38%,100% 50%,62% 62%,50% 100%,38% 62%,0 50%,38% 38%);border:0;width:14px;height:14px}
@keyframes pxa{0%{transform:translate(0,0) rotate(0)}100%{transform:translate(var(--dx),var(--dy)) rotate(360deg) scale(.3);opacity:0}}
.smoke{position:absolute;width:16px;height:16px;margin:-8px;background:#d8d2e8;border:2px solid #6b6585;animation:sk .7s steps(7) forwards}
@keyframes sk{to{transform:scale(2.4) rotate(90deg);opacity:0}}
.ghost{position:absolute;width:96px;height:96px;margin:-48px;opacity:.55;animation:gh .4s steps(4) forwards}
.ghost img{width:100%;height:100%;filter:brightness(2) drop-shadow(0 0 8px #ffb)}
@keyframes gh{to{opacity:0;transform:scale(.7)}}
.lzr{position:absolute;height:26px;margin-top:-13px;transform-origin:0 50%;background:linear-gradient(90deg,#fff,var(--lc),var(--lc) 70%,#fff0);box-shadow:0 0 20px var(--lc),0 0 40px var(--lc);animation:lz .5s steps(6) forwards;border-radius:13px}
@keyframes lz{0%{opacity:0;clip-path:inset(0 100% 0 0)}25%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}
.dim2{position:absolute;inset:0;background:#000;animation:fl .5s steps(5) forwards}
.proj{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px;z-index:7}
.proj img{width:100%;height:100%;filter:drop-shadow(0 0 12px #ffd)}
.ball{width:28px;height:28px;margin:-14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#777,#111);border:3px solid #000;box-shadow:0 0 14px 4px #ff9a2e,inset -3px -3px 0 #0008}
.claw{position:absolute;width:160px;height:12px;margin:-6px -80px;background:linear-gradient(90deg,#fff0,#fff 30%,#ffec80 70%,#fff0);box-shadow:0 0 14px #fff,0 0 26px #ff8;animation:cl .45s steps(6) forwards}
@keyframes cl{0%{opacity:0;clip-path:inset(0 100% 0 0)}25%{opacity:1;clip-path:inset(0 0 0 0)}100%{opacity:0}}

/* ===== 音效＋背景音樂（WebAudio 合成，無外部檔案）===== */
let AC = null, MASTER = null, SFXB = null, MUSB = null;
const ac = () => {
  if (!AC) {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.knee.value = 12; comp.ratio.value = 6; comp.attack.value = .004; comp.release.value = .18;
    MASTER = AC.createGain(); MASTER.gain.value = .9; MASTER.connect(comp); comp.connect(AC.destination);
    SFXB = AC.createGain(); SFXB.gain.value = 1; SFXB.connect(MASTER);
    MUSB = AC.createGain(); MUSB.gain.value = .5; MUSB.connect(MASTER);
  }
  if (AC.state === 'suspended') AC.resume();
  return AC;
};
let NB = null;
const noiseBuf = A => { if (!NB || NB.sampleRate !== A.sampleRate) { NB = A.createBuffer(1, A.sampleRate * 2, A.sampleRate); const d = NB.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; } return NB; };
/* 單音：f0→f1 指數滑音、dur 秒、vol 音量、d 延遲、dest 輸出（預設音效匯流排）*/
function osc(type, f0, f1, dur, vol = .1, d = 0, dest) {
  if (muted) return; try {
    const A = ac(), o = A.createOscillator(), g = A.createGain(), t = A.currentTime + d;
    o.type = type; o.frequency.setValueAtTime(Math.max(20, f0), t); if (f1 && f1 !== f0) o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .006); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(dest || SFXB); o.start(t); o.stop(t + dur + .03);
  } catch (e) {}
}
/* 噪音：濾波器 ft（lowpass/bandpass/highpass）從 f0 掃到 f1 */
function nz(dur, vol = .15, d = 0, ft = 'lowpass', f0 = 2000, f1 = 0, q = 1, dest) {
  if (muted) return; try {
    const A = ac(), s = A.createBufferSource(), fl = A.createBiquadFilter(), g = A.createGain(), t = A.currentTime + d;
    s.buffer = noiseBuf(A); s.loop = true; fl.type = ft; fl.Q.value = q; fl.frequency.setValueAtTime(f0, t); if (f1) fl.frequency.exponentialRampToValueAtTime(Math.max(30, f1), t + dur);
    g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(vol, t + .008); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    s.connect(fl).connect(g).connect(dest || SFXB); s.start(t, Math.random()); s.stop(t + dur + .03);
  } catch (e) {}
}
const NOTE = (n, base = 440) => base * Math.pow(2, n / 12);
const duck = (to = .22, ms = 380) => { if (!MUSB || muted) return; const t = AC.currentTime; MUSB.gain.cancelScheduledValues(t); MUSB.gain.setValueAtTime(MUSB.gain.value, t); MUSB.gain.linearRampToValueAtTime(to, t + .03); MUSB.gain.linearRampToValueAtTime(.5, t + ms / 1000); };
const SFX = {
  flip: () => { osc('square', 620, 980, .06, .05); nz(.04, .05, 0, 'highpass', 3000); },
  deal: () => { for (let i = 0; i < 6; i++) { nz(.05, .06, i * .05, 'bandpass', 2400, 0, 2); osc('square', 400 + i * 60, 0, .03, .03, i * .05); } },
  sum: () => { [0, 4, 7, 12, 16].forEach((n, i) => osc('square', NOTE(n, 330), 0, .13, .055, i * .055)); nz(.5, .06, .05, 'highpass', 1500, 6000); osc('sine', 1760, 2637, .4, .04, .2); },
  charge: () => { osc('sawtooth', 90, 760, .5, .07); osc('square', 180, 1200, .5, .03); nz(.5, .08, 0, 'bandpass', 300, 3500, 3); },
  shot: () => { osc('sine', 170, 38, .4, .5); nz(.35, .3, 0, 'lowpass', 1800, 120); nz(.08, .2, 0, 'highpass', 3500); osc('sawtooth', 240, 50, .25, .1); duck(.25, 450); },
  roar: () => { osc('sawtooth', 130, 62, .6, .09); osc('sawtooth', 134, 64, .6, .09); nz(.55, .16, 0, 'bandpass', 500, 220, 2); osc('square', 90, 50, .5, .06); duck(.3, 600); },
  hit: () => { nz(.2, .24, 0, 'bandpass', 1400, 180, 1.5); osc('sawtooth', 200, 55, .22, .12); osc('sine', 120, 40, .22, .35); nz(.05, .15, 0, 'highpass', 4000); duck(.28, 300); },
  big: () => { nz(.6, .38, 0, 'lowpass', 3500, 100); osc('sine', 85, 28, .7, .55); osc('sawtooth', 260, 40, .5, .14); nz(.12, .26, 0, 'highpass', 3000); osc('square', 880, 220, .25, .07, .02); duck(.15, 700); },
  combo: n => { const b = NOTE(Math.min(12, n * 2), 523); osc('triangle', b, 0, .1, .1); osc('triangle', b * 1.5, 0, .14, .09, .07); osc('square', b * 2, 0, .1, .04, .07); },

/* ---- 一對配成：召喚演出＋效果 ---- */

async function resolvePair(who, a, b) {
